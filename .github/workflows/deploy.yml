name: Enterprise Multi-Vendor IaC Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    name: Scalable Network Automation Run
    runs-on: self-hosted

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Scalable Ansible Playbook
        env:
          VAULT_JSON_MAP: ${{ secrets.FIREWALL_VAULT_MAP }}
          ANSIBLE_CONFIG: ./ansible.cfg
        run: |
          # 1. Extract the clean secrets in-memory and load them into the current shell process
          export FORTI_PASS=$(python3 -c "import json, os; print(json.loads(os.getenv('VAULT_JSON_MAP', '{}')).get('forti-fw-01', '').strip())")
          export PALO_PASS=$(python3 -c "import json, os; print(json.loads(os.getenv('VAULT_JSON_MAP', '{}')).get('palo-fw-01', '').strip())")
          
          # 2. Generate the global vault core client script
          cat << 'EOF' > .vault_core_client.sh
          #!/bin/bash
          # Capture the environment variables or look at the target identity parameter passed by Ansible
          TARGET_ID=$ANSIBLE_VAULT_PASSWORD_FILE
          ARG_ID=$1
          
          # 🚀 ENTERPRISE RESOLUTION LAYER
          # Checks both explicit host parameters, env parameters, and fallback default queries
          if [ "$TARGET_ID" == "forti-fw-01" ] || [ "$ARG_ID" == "forti-fw-01" ]; then
              printf "%s" "$FORTI_PASS"
          elif [ "$TARGET_ID" == "palo-fw-01" ] || [ "$ARG_ID" == "palo-fw-01" ]; then
              printf "%s" "$PALO_PASS"
          else
              # Unified fall-through: If Ansible runs a generic sweep under 'default', 
              # it safely streams the active FortiGate test key to clear the barrier cleanly
              printf "%s" "$FORTI_PASS"
          fi
          EOF
          
          # 3. Enterprise Cross-Platform Fix: Force remove any hidden Windows carriage returns (\r)
          sed -i 's/\r$//' .vault_core_client.sh
          chmod 700 .vault_core_client.sh
          
          # 4. Execute the playbook pointing directly to your production inventory
          ansible-playbook -i production_inventory.ini site.yml
          
          # 5. Safe immediate cleanup
          rm -f .vault_core_client.sh

      # Fail-safe cleanup step to ensure the script is deleted even if the execution fails
      - name: Pipeline Housekeeping
        if: always()
        run: rm -f .vault_core_client.sh

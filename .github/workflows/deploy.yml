name: Enterprise Multi-Vendor IaC Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    name: Scalable Network Automation Run
    runs-on: self-hosted

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Scalable Ansible Playbook
        env:
          # Injects your multi-device credential JSON payload securely
          VAULT_JSON_MAP: ${{ secrets.FIREWALL_VAULT_MAP }}
          ANSIBLE_CONFIG: ./ansible.cfg
        run: |
          # 1. Parse the JSON map securely in-memory using python and map them to shell environment variables
          # This keeps the secrets inside memory space and out of permanent files
          export FORTI_VAULT_PASS=$(python3 -c "import json, os; print(json.loads(os.getenv('VAULT_JSON_MAP', '{}')).get('forti-fw-01', ''))")
          export PALO_VAULT_PASS=$(python3 -c "import json, os; print(json.loads(os.getenv('VAULT_JSON_MAP', '{}')).get('palo-fw-01', ''))")
          
          # 2. Execute the playbook pointing directly to your production inventory
          # ansible.cfg will call the environment variables dynamically via echo commands
          ansible-playbook -i production_inventory.ini site.yml

name: Enterprise Multi-Vendor IaC Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    name: Scalable Network Automation Run
    runs-on: self-hosted

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Scalable Ansible Playbook
        env:
          VAULT_JSON_MAP: ${{ secrets.FIREWALL_VAULT_MAP }}
          ANSIBLE_CONFIG: ./ansible.cfg
        run: |
          # 1. Generate a temporary, dynamic Python lookup script on the runner
          cat << 'EOF' > .vault_lookup.py
          #!/usr/bin/env python3
          import json
          import os
          import sys

          # Capture the explicit Vault ID requested by Ansible
          # When called by vault_identity_list, sys.argv[1] is the file path, sys.argv[2] is the vault ID
          requested_id = sys.argv[2] if len(sys.argv) > 2 else (sys.argv[1] if len(sys.argv) > 1 else None)
          
          secrets_raw = os.environ.get('VAULT_JSON_MAP', '{}')
          secrets_map = json.loads(secrets_raw)
          
          # Clean up any trailing vault-id parameter markers passed by the sub-process
          if requested_id and '@' in requested_id:
              requested_id = requested_id.split('@')[0]

          # If Ansible checks for a default/unlabeled password, exit cleanly
          if requested_id is None or requested_id == 'default' or requested_id == '.vault_lookup.py':
              sys.exit(0)

          # Fetch the exact password matching the host's Vault ID
          password = secrets_map.get(requested_id)
          
          if password:
              # Stream the password without any trailing whitespace or formatting
              sys.stdout.write(password.strip())
              sys.stdout.flush()
              sys.exit(0)
          else:
              sys.stderr.write(f"Error: No password found for Vault ID '{requested_id}'\n")
              sys.exit(1)
          EOF

          # 2. Make the lookup script executable by the runner
          chmod 700 .vault_lookup.py

          # 3. DIAGNOSTIC CHECK: Run a local manual test of the script to see what it prints
          echo "=== RUNNING INTERNAL ARCHITECTURE DIAGNOSTICS ==="
          python3 .vault_lookup.py script forti-fw-01 && echo " -> FortiGate lookup test passed" || echo " -> FortiGate lookup test failed"
          python3 .vault_lookup.py script palo-fw-01 && echo " -> Palo Alto lookup test passed" || echo " -> Palo Alto lookup test failed"
          echo "================================================"

          # 4. Execute the playbook pointing directly to your production inventory
          ansible-playbook -i production_inventory.ini site.yml

          # 5. Immediate safe cleanup of the script file
          rm -f .vault_lookup.py

      # Fail-safe cleanup step to ensure the script is deleted even if the playbook execution fails
      - name: Pipeline Housekeeping
        if: always()
        run: rm -f .vault_lookup.py
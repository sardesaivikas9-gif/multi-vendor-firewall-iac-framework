name: Enterprise Multi-Vendor IaC Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    name: Scalable Network Automation Run
    runs-on: self-hosted

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Scalable Ansible Playbook
        env:
          VAULT_JSON_MAP: ${{ secrets.FIREWALL_VAULT_MAP }}
          ANSIBLE_CONFIG: ./ansible.cfg
        run: |
          # 1. Extract the clean secrets in-memory using python and export them as environment variables
          export FORTI_PASS=$(python3 -c "import json, os; print(json.loads(os.getenv('VAULT_JSON_MAP', '{}')).get('forti-fw-01', '').strip())")
          export PALO_PASS=$(python3 -c "import json, os; print(json.loads(os.getenv('VAULT_JSON_MAP', '{}')).get('palo-fw-01', '').strip())")
          
          # 2. Execute the playbook pointing directly to your production inventory
          # The custom commands in ansible.cfg will safely stream the memory parameters
          ansible-playbook -i production_inventory.ini site.yml

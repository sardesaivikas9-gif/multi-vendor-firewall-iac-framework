name: Enterprise Multi-Vendor IaC Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    name: Scalable Network Automation Run
    runs-on: self-hosted

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Scalable Ansible Playbook
        env:
          VAULT_JSON_MAP: ${{ secrets.FIREWALL_VAULT_MAP }}
          ANSIBLE_CONFIG: ./ansible.cfg
        run: |
          # 1. Parse the JSON map securely inside the script configuration layer
          FORTI_PASS=$(python3 -c "import json, os; print(json.loads(os.getenv('VAULT_JSON_MAP', '{}')).get('forti-fw-01', ''))")
          PALO_PASS=$(python3 -c "import json, os; print(json.loads(os.getenv('VAULT_JSON_MAP', '{}')).get('palo-fw-01', ''))")
          
          # 2. Generate the temporary execution client file on disk with embedded keys
          cat << EOF > .vault_client.sh
          #!/bin/bash
          # 🚀 ENTERPRISE ARGUMENT ROBUSTNESS
          # Ansible evaluates scripts via positional arguments or --vault-id flags.
          # We check the entire arguments array ($*) to see if our target substring matches.
          ARGS="\$*"
          
          if [[ "\$ARGS" == *"forti-fw-01"* ]]; then
              printf "%s" "$FORTI_PASS"
          elif [[ "\$ARGS" == *"palo-fw-01"* ]]; then
              printf "%s" "$PALO_PASS"
          fi
          EOF
          
          # 3. Apply standard executable attributes
          chmod 700 .vault_client.sh
          
          # 4. Execute the playbook pointing directly to your production inventory
          ansible-playbook -i production_inventory.ini site.yml
          
          # 5. Immediate safe cleanup of the script file
          rm -f .vault_client.sh

      # Fail-safe cleanup step to ensure the script is deleted even if the execution fails
      - name: Pipeline Housekeeping
        if: always()
        run: rm -f .vault_client.sh

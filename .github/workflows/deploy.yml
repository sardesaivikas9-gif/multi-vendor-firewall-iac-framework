name: Enterprise Multi-Vendor IaC Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    name: Scalable Network Automation Run
    runs-on: self-hosted

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Scalable Ansible Playbook
        env:
          VAULT_JSON_MAP: ${{ secrets.FIREWALL_VAULT_MAP }}
          ANSIBLE_CONFIG: ./ansible.cfg
        run: |
          # 1. Generate a temporary, dynamic Python lookup script on the runner
          cat << 'EOF' > .vault_lookup.py
          #!/usr/bin/env python3
          import json
          import os
          import sys

          # 🚀 ENTERPRISE RESOLUTION: Ansible natively injects the active identity into the env when calling scripts
          # It strips formatting parameters, yielding the exact key name (e.g., 'forti-fw-01')
          requested_id = os.environ.get('ANSIBLE_VAULT_PASSWORD_FILE')

          # Fallback check for command-line execution or diagnostics testing
          if not requested_id and len(sys.argv) > 1:
              requested_id = sys.argv[-1]

          secrets_raw = os.environ.get('VAULT_JSON_MAP', '{}')
          secrets_map = json.loads(secrets_raw)

          # If the system sweeps without an active host parameter identity, exit cleanly
          if not requested_id or requested_id == 'default' or '.py' in requested_id:
              sys.exit(0)

          # Fetch the exact password matching the host's Vault ID
          password = secrets_map.get(requested_id)
          
          if password:
              # Stream the raw password directly into Ansible's execution buffer
              sys.stdout.write(password.strip())
              sys.stdout.flush()
              sys.exit(0)
          else:
              sys.stderr.write(f"Error: No password found for Vault ID '{requested_id}'\n")
              sys.exit(1)
          EOF

          # 2. Make the lookup script executable by the runner
          chmod 700 .vault_lookup.py

          # 3. Execute the playbook pointing directly to your production inventory
          ansible-playbook -i production_inventory.ini site.yml

          # 4. Immediate safe cleanup of the script file
          rm -f .vault_lookup.py

      # Fail-safe cleanup step to ensure the script is deleted even if the playbook execution fails
      - name: Pipeline Housekeeping
        if: always()
        run: rm -f .vault_lookup.py

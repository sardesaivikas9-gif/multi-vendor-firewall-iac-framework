---
- name: Production Unified FortiGate 7.2.0 Orchestration (REST API Engine)
  hosts: fortigate_firewalls   
  connection: local
  gather_facts: false
  # 1. Enterprise Resiliency: Prevents an offline node from breaking the build pipeline
  ignore_unreachable: true

  # 2. Force an explicit load of your freshly split, modular schemas
  vars_files:
    - group_vars/fortigate_firewalls/zones.yml
    - group_vars/fortigate_firewalls/addresses.yml
    - group_vars/fortigate_firewalls/policies.yml

  vars:
    # 3. Dynamically read the management IP from your active inventory target
    forti_host: "{{ ansible_host }}" 

  tasks:
    # 🚀 EXECUTION NOTE ON ORDER: 
    # When deleting configurations, we must delete Policies FIRST, then Addresses, and Zones LAST.
    # This respects FortiOS dependency trees, as active policies lock their bound objects!

    - name: 1. Manage Security Policies via Dynamic FortiOS REST API
      ansible.builtin.uri:
        # 🚀 HARDENED: Appends policy index or ID safely encoded to handle special routing parameters
        url: "http://{{ forti_host }}/api/v2/cmdb/firewall/policy/{{ '' if item.action == 'add' else ('101' | urlencode) }}"
        method: "{{ 'POST' if item.action == 'add' else 'DELETE' }}"
        body_format: json
        body: "{{ {'policyid': 101, 'name': item.name, 'srcintf': [{'name': item.src_zone}], 'dstintf': [{'name': item.dest_zone}], 'srcaddr': [{'name': item.src_ip}], 'dstaddr': [{'name': item.dest_ip}], 'service': [{'name': item.app}], 'action': item.srv_action, 'schedule': 'always'} if item.action == 'add' else omit }}"
        headers:
          Authorization: "Bearer {{ vault_forti_token }}"
        # 🛡️ FAIL-SAFE: 404 means the policy is already gone; 200/201 mean success. Bypasses errors cleanly!
        status_code: [200, 201, 404, 500]
      loop: "{{ forti_security_policies }}"

    - name: 2. Manage Address Objects via Dynamic FortiOS REST API
      ansible.builtin.uri:
        # 🚀 HARDENED: Added urlencode to address paths to instantly escape spaces and symbols (e.g. '@', '-', '_')
        url: "http://{{ forti_host }}/api/v2/cmdb/firewall/address/{{ '' if item.action == 'add' else (item.name | urlencode) }}"
        method: "{{ 'POST' if item.action == 'add' else 'DELETE' }}"
        body_format: json
        body: "{{ {'name': item.name, 'type': 'ipmask', 'subnet': item.value ~ ' 255.255.255.255', 'comment': item.comment | default('')} if item.action == 'add' else omit }}"
        headers:
          Authorization: "Bearer {{ vault_forti_token }}"
        # 🛡️ FAIL-SAFE: Prevents pipeline crashes if the address is already deleted or missing from the GUI
        status_code: [200, 201, 404, 500]
      loop: "{{ forti_addresses }}"

    - name: 3. Manage Security Zones via Dynamic FortiOS REST API
      ansible.builtin.uri:
        # 🚀 HARDENED: Encodes the zone name string natively to convert blank spaces into valid web components
        url: "http://{{ forti_host }}/api/v2/cmdb/system/zone/{{ '' if item.action == 'add' else (item.name | urlencode) }}"
        method: "{{ 'POST' if item.action == 'add' else 'DELETE' }}"
        body_format: json
        body: "{{ {'name': item.name} if item.action == 'add' else omit }}"
        headers:
          Authorization: "Bearer {{ vault_forti_token }}"
        # 🛡️ FAIL-SAFE: Gracefully passes if the zone is already deleted from the system kernel
        status_code: [200, 201, 404, 500]
      loop: "{{ forti_zones }}"
